<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh 6</title>
    <style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
        color: #000000;
    }
    /*G Gaya dasar menu*/
    .menu {
        background-color: #000000;
        overflow: hidden;
    }
    .menu a {
        float: left;
        display: block;
        color: yellow;
        text-align: center;
        padding: 14px 20px;
        text-decoration: none;
        transition: background-color 0.3s;
    }
    /* Efek hover */
    .menu a:hover {
        background-color: rgb(163, 1, 1);
        color: white;
    }
    </style>
</head>
<body>
    <h2>Contoh Menu Hover</h2>

    <div class="menu">
        <a href="#">Beranda</a>
        <a href="#">Tentang</a>
        <a href="#">Layanan</a>
        <a href="#">Kontak</a>
    </div>
</body>
</html>
